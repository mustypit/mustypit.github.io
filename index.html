<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="canvas-page">
<div class="viewport" id="viewport">
  <div class="world" id="world">
    <div class="center-name">
      <span class="center-title" data-site="name"></span>
      <span class="center-sub" data-site="tagline"></span>
    </div>
    <svg class="ink" id="ink" width="5000" height="3600" viewBox="0 0 5000 3600" aria-hidden="true"></svg>
  </div>

  <header class="top">
    <a class="name-pill" href="about.html" data-site="name"></a>
    <span class="top-right">
      <a class="t icon" id="mail" href="#" aria-label="Email" title="Email">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1"></rect><path d="M3.5 6.5l8.5 6.5 8.5-6.5"></path></svg>
      </a>
      <a class="t icon" id="insta" href="#" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.2" cy="6.8" r="0.9" fill="currentColor" stroke="none"></circle></svg>
      </a>
    </span>
  </header>

  <nav class="toolbar" aria-label="Canvas tools">
    <button type="button" class="t" id="zoomOut" aria-label="Zoom out">−</button>
    <span class="zoom" id="zoomLabel">100%</span>
    <button type="button" class="t" id="zoomIn" aria-label="Zoom in">+</button>
    <span class="sep" aria-hidden="true">/</span>
    <button type="button" class="t" id="seeAll">See all</button>
    <button type="button" class="t" id="center">Center</button>
    <button type="button" class="t" id="reset">Reset</button>
    <span class="sep" aria-hidden="true">/</span>
    <button type="button" class="t icon" id="stamp" aria-pressed="false" title="Sparkle stamp" aria-label="Sparkle stamp">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path id="stampIcon" d="" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg>
    </button>
    <button type="button" class="t" id="clear" hidden>Clear</button>
  </nav>
</div>

<script src="content.js"></script>
<script src="js/shapes.js"></script>
<script src="js/canvas.js"></script>
</body>
</html>
