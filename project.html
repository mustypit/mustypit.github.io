<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="project-page">
<header class="p-header">
  <a href="index.html" class="p-name" data-site="name"></a>
  <a href="index.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    All work
  </a>
</header>

<section class="p-intro">
  <div class="left">
    <span class="p-num"><span id="cat"></span> <span id="num"></span></span>
    <h1 class="p-title" id="title"></h1>
  </div>
  <div class="right">
    <p class="p-text" id="text"></p>
    <dl class="p-meta">
      <div><dt>Year</dt><dd id="year"></dd></div>
      <div><dt>Location</dt><dd id="location"></dd></div>
      <div><dt>Client</dt><dd id="client"></dd></div>
    </dl>
  </div>
  <nav class="p-siblings" id="siblings" aria-label="Projects in this category"></nav>
</section>

<section class="viewer" aria-roledescription="carousel" aria-label="Project images">
  <div class="stage" id="stage">
    <button type="button" class="zone prev" id="zPrev" aria-label="Previous image"></button>
    <button type="button" class="zone next" id="zNext" aria-label="Next image"></button>
  </div>
  <div class="v-bar">
    <span class="v-count" id="count" aria-live="polite"></span>
    <span class="v-btns">
      <button type="button" class="t" id="bPrev">Previous</button>
      <button type="button" class="t" id="bNext">Next</button>
    </span>
  </div>
</section>



<nav class="p-nav" aria-label="Project navigation">
  <a id="prev" href="index.html"></a>
  <a id="next" href="index.html"></a>
</nav>

<script src="content.js"></script>
<script>
(function () {
  var SITE = window.SITE || { projects: {} };
  document.querySelectorAll('[data-site]').forEach(function (el) { el.textContent = SITE[el.getAttribute('data-site')] || ''; });
  var all = Object.keys(SITE.projects || {});
  var q = new URLSearchParams(location.search);
  var id = q.get('p');
  if (all.indexOf(id) < 0) id = all[0];
  var p = (SITE.projects || {})[id] || {};
  // Projects in the same category, in content.js order
  var ids = all.filter(function (k) { return (SITE.projects[k].category || '') === (p.category || ''); });
  var i = ids.indexOf(id);
  var link = function (k, at) { return 'project.html?p=' + encodeURIComponent(k) + (at ? '&i=' + at : ''); };
  document.title = (p.title || 'Project') + (SITE.name ? ' · ' + SITE.name : '');
  var set = function (k, v) { var el = document.getElementById(k); if (el) el.textContent = v || ''; };
  set('cat', p.category ? p.category + ' ·' : '');
  set('num', String(i + 1).padStart(2, '0') + ' / ' + String(ids.length).padStart(2, '0'));
  var sib = document.getElementById('siblings');
  if (ids.length > 1) {
    ids.forEach(function (k, n) {
      var a = document.createElement('a');
      a.href = link(k);
      a.textContent = String(n + 1).padStart(2, '0') + ' ' + (SITE.projects[k].title || '');
      if (k === id) { a.setAttribute('aria-current', 'page'); }
      sib.appendChild(a);
    });
  } else { sib.hidden = true; }
  ['title', 'text', 'year', 'location', 'client'].forEach(function (k) { set(k, p[k]); });

  // ----- One-at-a-time viewer -----
  var slides = (p.images || []).map(function (src) { return { type: 'img', src: src }; });
  if (p.video) slides.splice(Math.min(1, slides.length), 0, { type: 'video', src: p.video });
  var stage = document.getElementById('stage');
  var els = slides.map(function (s, n) {
    var el;
    if (s.type === 'img') {
      el = document.createElement('img');
      el.src = s.src; el.alt = (p.title || '') + ' — ' + (n + 1);
      el.loading = n < 2 ? 'eager' : 'lazy'; el.draggable = false;
    } else {
      el = document.createElement('div'); el.className = 'v-video';
      var f = document.createElement('iframe');
      f.dataset.src = s.src; f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true; f.title = p.title || 'Video';
      el.appendChild(f);
    }
    el.classList.add('slide');
    stage.insertBefore(el, document.getElementById('zPrev'));
    return el;
  });
  var prevId = ids[(i - 1 + ids.length) % ids.length], nextId = ids[(i + 1) % ids.length];
  var multi = ids.length > 1;
  var start = q.get('i') === 'last' ? els.length - 1 : 0;
  var cur = 0;
  function show(n) {
    if (!els.length) { document.querySelector('.viewer').hidden = true; return; }
    if (multi && n >= els.length) { location.href = link(nextId); return; }
    if (multi && n < 0) { location.href = link(prevId, 'last'); return; }
    cur = (n + els.length) % els.length;
    els.forEach(function (el, k) {
      var on = k === cur;
      el.classList.toggle('on', on);
      var f = el.querySelector && el.querySelector('iframe');
      if (f) { if (on && !f.src) f.src = f.dataset.src; if (!on && f.src) f.removeAttribute('src'); }
    });
    var two = function (x) { return String(x).padStart(2, '0'); };
    document.getElementById('count').textContent = two(cur + 1) + ' / ' + two(els.length);
    var single = els.length < 2 && !multi;
    var isVideo = slides[cur].type === 'video';
    ['bPrev', 'bNext'].forEach(function (id) { document.getElementById(id).hidden = single; });
    ['zPrev', 'zNext'].forEach(function (id) { document.getElementById(id).hidden = single || isVideo; });
  }
  document.getElementById('zPrev').onclick = document.getElementById('bPrev').onclick = function () { show(cur - 1); };
  document.getElementById('zNext').onclick = document.getElementById('bNext').onclick = function () { show(cur + 1); };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') show(cur + 1);
    else if (e.key === 'ArrowLeft') show(cur - 1);
  });
  var sx = null;
  stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
  });
  show(start);

  if (ids.length > 1) {
    var prev = prevId, next = nextId;
    var pa = document.getElementById('prev'), na = document.getElementById('next');
    pa.href = 'project.html?p=' + encodeURIComponent(prev);
    pa.textContent = '← Previous: ' + (SITE.projects[prev].title || '');
    na.href = 'project.html?p=' + encodeURIComponent(next);
    na.textContent = 'Next: ' + (SITE.projects[next].title || '') + ' →';
  }
})();
</script>
</body>
</html>
